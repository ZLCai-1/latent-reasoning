# =============================================================================
# GPT-2 CoT SFT (Teacher 模型)
# 对齐 CODI 论文超参：LoRA rank=128, LR=3e-3, batch=128, 40 epochs
# 训练完成后用作 extract_teacher_states 的 teacher
# =============================================================================

defaults:
  - ../base

model:
  name: "models/gpt2-local"
  num_latent_tokens: 0  # Teacher 不用 latent tokens

data:
  dataset: "gsm8k"
  data_path: "data/gsm8k_aug_train.json"
  num_spans: 0
  span_strategy: "none"
  max_seq_length: 512

training:
  batch_size: 16
  gradient_accumulation_steps: 8  # effective batch = 128
  learning_rate: 3.0e-3           # CODI GPT-2 用 3e-3
  num_epochs: 40
  warmup_ratio: 0.03              # CODI 用 3%
  weight_decay: 0.01
  fp16: true
  gradient_checkpointing: false   # GPT-2 小模型不需要
  use_lora: true

lora:
  r: 128                          # CODI 用 rank=128
  alpha: 32
  target_modules: ["c_attn", "c_proj"]  # GPT-2 attention 层名
  dropout: 0.05

loss:
  transition_weight: 0.0
  anchor_weight: 0.0
  bridge_weight: 0.0
  generation_weight: 1.0          # 纯 CoT SFT

curriculum:
  enabled: false

evaluation:
  eval_interval: 5
  metrics: ["accuracy"]

logging:
  use_wandb: false
  project_name: "latent-reasoning"
  run_name: "gpt2-cot-sft"
  log_interval: 50

checkpoint:
  save_dir: "checkpoints/gpt2/cot_sft"
  save_interval: 5
  keep_top_k: 999

teacher:
  model_name: null
  cache_dir: "data/teacher_states_gpt2"
  cache_format: "hdf5"
  extract_batch_size: 32
  store_fp16: true
