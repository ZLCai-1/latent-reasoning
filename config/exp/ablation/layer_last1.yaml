# =============================================================================
# 消融实验：仅对齐最后 1 层
# 验证：层数对 transition alignment 的影响
# =============================================================================

defaults:
  - ../stage1_transition

model:
  layer_ids: [-1]

# 禁用 curriculum，保证 loss 权重稳定可比
curriculum:
  enabled: false

loss:
  transition_weight: 0.5
  anchor_weight: 0.1
  bridge_weight: 0.1
  generation_weight: 0.3
  normalize_transition: true

logging:
  run_name: "ablation-layer-last1"

checkpoint:
  save_dir: "checkpoints/ablation/layer_last1"
# =============================================================================
# 消融实验：仅对齐最后 1 层
# =============================================================================
