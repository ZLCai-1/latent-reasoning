# =============================================================================
# 消融实验：仅保留 transition + generation（去掉 anchor 和 bridge）
# 验证：去掉两个辅助 loss 后 transition 单独的能力
# =============================================================================

defaults:
  - ../stage1_transition

# 禁用 curriculum，避免 loss 权重被动态覆盖
curriculum:
  enabled: false

loss:
  transition_weight: 0.7
  anchor_weight: 0.0    # ← 消融目标
  bridge_weight: 0.0    # ← 消融目标
  generation_weight: 0.3
  normalize_transition: true

logging:
  run_name: "ablation-transition-only"

checkpoint:
  save_dir: "checkpoints/ablation/transition_only"
# =============================================================================
# 消融实验：仅保留 transition + generation loss，去掉 anchor 和 bridge
# =============================================================================
