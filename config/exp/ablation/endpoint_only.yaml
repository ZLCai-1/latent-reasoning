# =============================================================================
# 消融实验：Endpoint-only Matching（模拟 CODI 方法）
# 只对齐每个 span boundary 位置的绝对隐状态 s_k^S → s_k^T
# 不对齐状态差分 ΔH（即去掉我们的核心创新 transition loss）
# 验证：transition alignment 相比 endpoint matching 的增量贡献
# =============================================================================

defaults:
  - ../stage1_transition

# 禁用 curriculum，避免 loss 权重被动态覆盖
curriculum:
  enabled: false

loss:
  transition_weight: 0.0    # 不对齐差分（去掉核心创新）
  anchor_weight: 0.5        # 对齐绝对状态（CODI-style endpoint matching）
  bridge_weight: 0.0        # 不用 bridge（CODI 没有这个）
  generation_weight: 0.3
  normalize_transition: true

logging:
  run_name: "ablation-endpoint-only"

checkpoint:
  save_dir: "checkpoints/ablation/endpoint_only"
