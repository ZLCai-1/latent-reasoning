# =============================================================================
# 消融实验：对齐最后 4 层
# 验证：增加对齐层数是否提升效果
# =============================================================================

defaults:
  - ../stage1_transition

model:
  layer_ids: [-1, -2, -3, -4]

# 禁用 curriculum，保证 loss 权重稳定可比
curriculum:
  enabled: false

loss:
  transition_weight: 0.5
  anchor_weight: 0.1
  bridge_weight: 0.1
  generation_weight: 0.3
  normalize_transition: true

logging:
  run_name: "ablation-layer-last4"

checkpoint:
  save_dir: "checkpoints/ablation/layer_last4"
# =============================================================================
# 消融实验：对齐最后 4 层
# =============================================================================
