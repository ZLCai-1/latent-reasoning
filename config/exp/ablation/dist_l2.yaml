# =============================================================================
# 消融实验：原始 L2 距离（不归一化）
# 验证：归一化对训练稳定性的影响
# =============================================================================

defaults:
  - ../stage1_transition

# 禁用 curriculum，保证 loss 权重稳定可比
curriculum:
  enabled: false

loss:
  transition_weight: 0.5
  anchor_weight: 0.1
  bridge_weight: 0.1
  generation_weight: 0.3
  normalize_transition: false    # ← 消融目标：不归一化

logging:
  run_name: "ablation-dist-l2"

checkpoint:
  save_dir: "checkpoints/ablation/dist_l2"
# =============================================================================
# 消融实验：L2 距离（normalize_transition=false，与默认相同，作为对照）
# =============================================================================
