# =============================================================================
# 消融实验：K=1（仅 1 个 latent token）
# =============================================================================

defaults:
  - ../stage1_transition

model:
  num_latent_tokens: 1

curriculum:
  enabled: true
  stages:
    - {num_latent: 1, epochs: 15, transition_weight: 0.7, generation_weight: 0.3}

logging:
  run_name: "ablation-k1"

checkpoint:
  save_dir: "checkpoints/ablation/k1"
