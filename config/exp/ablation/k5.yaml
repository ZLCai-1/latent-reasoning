# =============================================================================
# 消融实验：K=5（5 个 latent tokens）
# =============================================================================

defaults:
  - ../stage1_transition

model:
  num_latent_tokens: 5

curriculum:
  enabled: true
  stages:
    - {num_latent: 1, epochs: 3, transition_weight: 0.8, generation_weight: 0.2}
    - {num_latent: 2, epochs: 3, transition_weight: 0.8, generation_weight: 0.2}
    - {num_latent: 3, epochs: 3, transition_weight: 0.7, generation_weight: 0.3}
    - {num_latent: 4, epochs: 3, transition_weight: 0.6, generation_weight: 0.4}
    - {num_latent: 5, epochs: 3, transition_weight: 0.5, generation_weight: 0.5}

logging:
  run_name: "ablation-k5"

checkpoint:
  save_dir: "checkpoints/ablation/k5"
