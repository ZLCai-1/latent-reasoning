# =============================================================================
# 消融实验：去掉 anchor loss（保留 transition + bridge + generation）
# 验证：anchor 防漂移的贡献，预期 endpoint_drift 上升
# =============================================================================

defaults:
  - ../stage1_transition

# 禁用 curriculum，避免 loss 权重被动态覆盖
curriculum:
  enabled: false

loss:
  transition_weight: 0.5
  anchor_weight: 0.0    # ← 消融目标
  bridge_weight: 0.1
  generation_weight: 0.3
  normalize_transition: true

logging:
  run_name: "ablation-no-anchor"

checkpoint:
  save_dir: "checkpoints/ablation/no_anchor"
# =============================================================================
# 消融实验：去掉 anchor loss
# =============================================================================

defaults:
  - ../stage1_transition

loss:
  anchor_weight: 0.0

logging:
  run_name: "ablation-no-anchor"

checkpoint:
  save_dir: "checkpoints/ablation/no_anchor"
