# =============================================================================
# Stage 0: CoT SFT Training
# 用标准 CoT 数据微调模型，作为同规模 student 的完整 CoT 上界
# =============================================================================

defaults:
  - ../base

model:
  name: "models/qwen2.5-math-1.5b"
  num_latent_tokens: 0  # Stage 0 不使用 latent tokens

data:
  dataset: "gsm8k"
  data_path: "data/gsm8k_aug_train.json"
  num_spans: 0  # 不划分 span，使用完整 CoT
  span_strategy: "none"
  max_seq_length: 512

training:
  batch_size: 32
  learning_rate: 5.0e-5
  num_epochs: 10
  gradient_accumulation_steps: 1
  warmup_ratio: 0.1
  weight_decay: 0.01
  fp16: true
  gradient_checkpointing: true
  use_lora: true

lora:
  r: 16
  alpha: 32
  target_modules: ["q_proj", "v_proj", "k_proj", "o_proj"]
  dropout: 0.05

loss:
  transition_weight: 0.0
  anchor_weight: 0.0
  bridge_weight: 0.0
  generation_weight: 1.0  # 仅使用 generation loss

curriculum:
  enabled: false

evaluation:
  eval_interval: 1
  metrics: ["accuracy", "exact_match"]

logging:
  use_wandb: false
  project_name: "latent-reasoning"
  run_name: "stage0-cot-sft"
  log_interval: 50

checkpoint:
  save_dir: "checkpoints/stage0_cot"
  save_interval: 1
  keep_top_k: 999
