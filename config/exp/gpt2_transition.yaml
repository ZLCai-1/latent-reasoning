# =============================================================================
# GPT-2 Transition-Aligned Student (主方法)
# 对齐 CODI 论文超参：LoRA rank=128, LR=3e-3, batch=128, 40 epochs
# 保持 transition-aligned loss 设计
# =============================================================================

defaults:
  - ../base

model:
  name: "models/gpt2-local"
  num_latent_tokens: 3            # 匹配数据 span 上限
  layer_ids: [-1, -3, -5, -7, -9, -11]  # GPT-2 共 12 层，对齐多层

data:
  dataset: "gsm8k"
  data_path: "data/gsm8k_aug_train.json"
  num_spans: 3
  span_strategy: "fixed"
  max_seq_length: 512

training:
  batch_size: 16
  gradient_accumulation_steps: 8  # effective batch = 128
  learning_rate: 3.0e-3           # CODI GPT-2 用 3e-3
  num_epochs: 40
  warmup_ratio: 0.03              # CODI 用 3%
  weight_decay: 0.01
  fp16: true
  gradient_checkpointing: false
  use_lora: true

lora:
  r: 128                          # CODI 用 rank=128
  alpha: 32
  target_modules: ["c_attn", "c_proj"]
  dropout: 0.05

loss:
  transition_weight: 0.5
  anchor_weight: 0.1
  bridge_weight: 0.1
  generation_weight: 0.3
  normalize_transition: true

curriculum:
  enabled: false

evaluation:
  eval_interval: 1
  metrics: ["accuracy"]

logging:
  use_wandb: false
  project_name: "latent-reasoning"
  run_name: "gpt2-transition-aligned"
  log_interval: 50

checkpoint:
  save_dir: "checkpoints/gpt2/student"
  save_interval: 1
  keep_top_k: 999

teacher:
  model_name: null
  cache_dir: "data/teacher_states_gpt2"
  cache_format: "hdf5"
  extract_batch_size: 32
  store_fp16: true
